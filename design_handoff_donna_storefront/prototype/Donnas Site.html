<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donna &amp; Co. · Engraved goods, made by hand</title>
  <meta name="description" content="A small Black-owned studio engraving tumblers, boards, wallets, decanters, and custom commissions. Hand-engraved in Charlotte, NC." />

  <!-- Fonts: Fraunces (display variable) + Inter (body) + a few alternates for Tweaks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Public+Sans:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/tokens.css" />
  <link rel="stylesheet" href="src/interactions.css" />

  <style>
    /* Responsive scaffolding */
    .desktop-only { display: inline-flex; }
    .mobile-only  { display: none !important; }
    @media (max-width: 880px) {
      .desktop-only { display: none !important; }
      .mobile-only  { display: flex !important; }
      .hero-grid, .hero-split, .studio-grid, .testi-grid, .customizer-grid,
      .pdp-grid, .shop-grid, .form-grid, .letter-grid, .contact-hero,
      .contact-form-grid, .press-grid, .policy-grid, .commission-band {
        grid-template-columns: 1fr !important;
      }
      .category-grid {
        grid-template-columns: 1fr 1fr !important;
        grid-auto-rows: 180px !important;
      }
      .category-grid > * {
        grid-column: auto !important;
        grid-row: auto !important;
      }
      .bestseller-grid, .shop-product-grid {
        grid-template-columns: 1fr 1fr !important;
      }
      .lifestyle-grid {
        grid-template-columns: 1fr 1fr !important;
      }
      .related-grid, .process-grid, .team-grid, .contact-tiles {
        grid-template-columns: 1fr 1fr !important;
      }
      .footer-top, .footer-cols {
        grid-template-columns: 1fr !important;
      }
      .values-grid {
        grid-template-columns: 1fr 1fr !important;
      }
      .gallery-grid {
        grid-template-columns: repeat(4, 1fr) !important;
        grid-auto-rows: 140px !important;
      }
      .gallery-grid > * {
        grid-area: auto !important;
      }
    }
    @media (max-width: 560px) {
      .bestseller-grid, .shop-product-grid, .related-grid,
      .lifestyle-grid, .process-grid, .team-grid,
      .contact-tiles, .category-grid, .values-grid {
        grid-template-columns: 1fr !important;
      }
      .gallery-grid {
        grid-template-columns: 1fr 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Image slot web component -->
  <script src="image-slot.js"></script>

  <!-- Data -->
  <script src="src/data.js"></script>

  <!-- Interaction wiring (ripples, magnetic, tilt, counters) -->
  <script src="src/interactions.js"></script>

  <!-- Tweaks panel -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Layout shell -->
  <script type="text/babel" src="src/layout.jsx"></script>

  <!-- Pages -->
  <script type="text/babel" src="src/home.jsx"></script>
  <script type="text/babel" src="src/shop.jsx"></script>
  <script type="text/babel" src="src/extras.jsx"></script>

  <!-- App (must come last) -->
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
